<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>考勤记录</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}"/>
    <style>
        .container { max-width: 1200px; margin-top: 30px; }
        .status-badge { padding: 5px 10px; border-radius: 5px; font-size: 12px; display: inline-block; }
        .status-normal { background-color: #28a745; color: white; }
        .status-late { background-color: #ffc107; color: #333; }
        .status-leave { background-color: #17a2b8; color: white; }
        .status-absent { background-color: #dc3545; color: white; }
    </style>
</head>
<body>
<div class="container">
    <h2>📋 我的考勤记录</h2>

    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
            <tr><th>日期</th><th>课程</th><th>打卡时间</th><th>状态</th><th>备注</th></tr>
            </thead>
            <tbody>
            <tr th:each="r : ${records}">
                <td th:text="${#temporals.format(r.attendanceDate, 'yyyy-MM-dd')}">-</td>
                <td th:text="${r.courseName}">-</td>
                <td th:text="${r.checkInTime != null ? #temporals.format(r.checkInTime, 'HH:mm:ss') : '-'}">-</td>
                <td>
                            <span th:class="'status-badge ' +
                                (r.status == 'NORMAL' ? 'status-normal' :
                                (r.status == 'LATE' ? 'status-late' :
                                (r.status == 'LEAVE' ? 'status-leave' : 'status-absent')))"
                                  th:text="${r.status == 'NORMAL' ? '正常' :
                                (r.status == 'LATE' ? '迟到' :
                                (r.status == 'LEAVE' ? '请假' : '旷课'))}">
                                正常
                            </span>
                </td>
                <td th:text="${r.remark != null ? r.remark : '-'}">-</td>
            </tr>
            <tr th:if="${records.isEmpty()}"><td colspan="5" class="text-center">暂无记录</td></tr>
            </tbody>
        </table>
    </div>

    <a href="/attendance/checkIn" class="btn btn-primary mt-3">返回打卡</a>
</div>
</body>
</html>
