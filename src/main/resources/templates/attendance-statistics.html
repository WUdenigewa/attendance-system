<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>考勤统计</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}"/>
</head>
<body>
<div class="container mt-4">
    <h2>📊 我的考勤统计</h2>

    <div class="row mt-4">
        <div class="col-md-3">
            <div class="card text-white bg-primary"><div class="card-body"><h3 th:text="${statistics.totalCount}">0</h3><p>总考勤次数</p></div></div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-success"><div class="card-body"><h3 th:text="${statistics.normalCount}">0</h3><p>正常</p></div></div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-warning"><div class="card-body"><h3 th:text="${statistics.lateCount}">0</h3><p>迟到</p></div></div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-info"><div class="card-body"><h3 th:text="${statistics.leaveCount}">0</h3><p>请假</p></div></div>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-header">出勤率</div>
        <div class="card-body text-center">
            <h1 th:text="${statistics.attendanceRate} + '%'">0%</h1>
            <div class="progress"><div class="progress-bar bg-success" th:style="'width:' + ${statistics.attendanceRate} + '%'"></div></div>
        </div>
    </div>

    <a href="/attendance/checkIn" class="btn btn-primary mt-3">返回打卡</a>
</div>
</body>
</html>
