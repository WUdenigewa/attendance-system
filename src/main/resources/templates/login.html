<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户登录</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}"/>
    <style>
        .container { max-width: 400px; margin-top: 100px; }
        .card-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .btn-login { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; width: 100%; }
        .btn-login:hover { background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%); }
    </style>
</head>
<body>
<div class="container">
    <div class="card shadow">
        <div class="card-header text-white text-center">
            <h3>用户登录</h3>
        </div>
        <div class="card-body">
            <div th:if="${error}" class="alert alert-danger" th:text="${errorMsg}">
                用户名或密码错误
            </div>
            <div th:if="${param.registered}" class="alert alert-success">
                注册成功，请登录
            </div>
            <form action="/login" method="post">
                <div class="mb-3">
                    <label class="form-label">用户名：</label>
                    <input type="text" name="username" class="form-control" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">密码：</label>
                    <input type="password" name="password" class="form-control" required/>
                </div>
                <button type="submit" class="btn btn-login text-white py-2">登录</button>
            </form>
            <div class="text-center mt-3">
                <a href="/register">还没有账号？立即注册</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
