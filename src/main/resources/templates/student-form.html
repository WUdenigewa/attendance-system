<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">学生表单</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}"/>
    <style>
        .container { max-width: 600px; margin-top: 50px; }
        .form-label { font-weight: bold; }
        .required:after { content: " *"; color: red; }
        .card-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .btn-save { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; }
        .btn-save:hover { background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%); }
    </style>
</head>
<body>
<div class="container">
    <div class="card shadow">
        <div class="card-header text-white">
            <h3 class="mb-0" th:text="${title}">学生信息</h3>
        </div>
        <div class="card-body">
            <!-- 表单提交地址改为 /student-web/save -->
            <form th:action="@{/student-web/save}" th:method="post" th:object="${student}">
                <!-- 隐藏字段：用于编辑时传递ID -->
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label required">学号：</label>
                    <input type="text" th:field="*{studentId}" class="form-control"
                           placeholder="请输入8位学号（2024开头）" required/>
                    <div class="form-text text-muted">学号格式：2024开头 + 4位数字，共8位</div>
                </div>

                <div class="mb-3">
                    <label class="form-label required">姓名：</label>
                    <input type="text" th:field="*{name}" class="form-control"
                           placeholder="请输入姓名" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label required">专业：</label>
                    <input type="text" th:field="*{major}" class="form-control"
                           placeholder="请输入专业" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label required">班级：</label>
                    <input type="text" th:field="*{className}" class="form-control"
                           placeholder="请输入班级" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label">电话：</label>
                    <input type="tel" th:field="*{phone}" class="form-control"
                           placeholder="请输入手机号码"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">邮箱：</label>
                    <input type="email" th:field="*{email}" class="form-control"
                           placeholder="请输入邮箱地址"/>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <button type="submit" class="btn btn-save btn-lg px-4 text-white">💾 保存</button>
                    <!-- 返回按钮链接改为 /student-web/list -->
                    <a th:href="@{/student-web/list}" class="btn btn-secondary btn-lg px-4">↩️ 返回</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
